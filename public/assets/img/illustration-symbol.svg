<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#234132"/>
  <circle cx="400" cy="300" r="260" fill="#38664f" opacity="0.35"/>

  <!-- large emblem diamond -->
  <g transform="translate(400,300)">
    <path d="M0 -150 L110 0 L0 150 L-110 0 Z" fill="none" stroke="white" stroke-width="5" opacity="0.9"/>
    <path d="M0 -95 L70 0 L0 95 L-70 0 Z" fill="#7a222b"/>
    <path d="M0 -55 L38 0 L0 55 L-38 0 Z" fill="white" opacity="0.92"/>
  </g>

  <!-- quill crossing the emblem -->
  <g transform="translate(400,300) rotate(-35)" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M-170 40 C -100 40 -40 10 20 -70 C 40 -98 60 -118 80 -128" />
    <path d="M20 -70 C 0 -70 -18 -58 -30 -40 C -10 -50 6 -62 20 -70 Z" fill="white" stroke="none"/>
  </g>

  <!-- small decorative dots echoing the poem's diamonds -->
  <g fill="white" opacity="0.85">
    <circle cx="400" cy="120" r="6"/>
    <circle cx="400" cy="480" r="6"/>
    <circle cx="180" cy="300" r="6"/>
    <circle cx="620" cy="300" r="6"/>
  </g>
</svg>
