<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#234132"/>
  <circle cx="60" cy="50" r="110" fill="white" opacity="0.06"/>
  <circle cx="540" cy="360" r="130" fill="white" opacity="0.06"/>

  <!-- Chalkboard frame -->
  <rect x="70" y="70" width="320" height="260" rx="10" fill="#2f5744" stroke="#7a222b" stroke-width="6"/>

  <!-- Big numeral 5 -->
  <text x="105" y="205" font-family="Georgia, 'Playfair Display', serif" font-size="150" fill="#fefaf3" opacity="0.92">5</text>

  <!-- Checklist lines -->
  <g stroke="#fefaf3" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="225" y1="120" x2="345" y2="120"/>
    <line x1="225" y1="160" x2="345" y2="160"/>
    <line x1="225" y1="200" x2="325" y2="200"/>
  </g>
  <g fill="#e3bcbe">
    <circle cx="205" cy="120" r="6"/>
    <circle cx="205" cy="160" r="6"/>
    <circle cx="205" cy="200" r="6"/>
  </g>

  <!-- Lightbulb / idea -->
  <g transform="translate(280,270)">
    <circle r="26" fill="#f3e6d0"/>
    <rect x="-10" y="20" width="20" height="14" rx="3" fill="#e3bcbe"/>
    <line x1="-8" y1="34" x2="8" y2="34" stroke="#234132" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Teacher silhouette holding a torch of ideas -->
  <g transform="translate(470,235)">
    <ellipse cx="0" cy="118" rx="70" ry="14" fill="black" opacity="0.12"/>
    <path d="M-55 120 C-58 40 -35 -10 0 -10 C35 -10 58 40 55 120 Z" fill="#f3e6d0"/>
    <circle cx="0" cy="-45" r="34" fill="#f3e6d0"/>
    <rect x="42" y="-4" width="10" height="90" rx="4" fill="#e3bcbe"/>
    <path d="M47 -4 C 30 -20 30 -45 47 -60 C 64 -45 64 -20 47 -4 Z" fill="#e3bcbe"/>
    <circle cx="47" cy="-40" r="5" fill="#fefaf3"/>
  </g>

  <!-- Tip stars -->
  <g fill="#e3bcbe" opacity="0.85">
    <path d="M420 90 l6 12 13 2 -9 9 2 13 -12 -6 -12 6 2 -13 -9 -9 13 -2 z"/>
    <path d="M400 145 l5 10 11 1 -8 7 2 11 -10 -5 -10 5 2 -11 -8 -7 11 -1 z"/>
  </g>
</svg>
