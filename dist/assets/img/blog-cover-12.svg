<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#234132"/>
  <circle cx="530" cy="335" r="115" fill="white" opacity="0.06"/>
  <circle cx="60" cy="60" r="95" fill="white" opacity="0.06"/>

  <!-- Land silhouette, split by a fracture -->
  <g fill="#f3e6d0" opacity="0.9">
    <path d="M60 300 L150 220 L230 260 L300 190 L300 300 Z"/>
    <path d="M310 300 L310 195 L380 245 L460 210 L545 300 Z"/>
  </g>

  <!-- Fracture line running through -->
  <g stroke="#7a222b" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M300 150 L288 190 L306 220 L282 255 L300 300"/>
  </g>

  <!-- Bird taking flight, symbolising displacement -->
  <g stroke="#e3bcbe" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M110 110 q18 -22 36 0 q18 -22 36 0"/>
    <path d="M400 90 q14 -17 28 0 q14 -17 28 0"/>
  </g>
</svg>
