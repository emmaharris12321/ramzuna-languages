title: Our Programmes
description: Free English, French, and German lessons for Palestinian students, taught by vetted volunteer educators worldwide.

# Programmes Grid
servicesGrid:
  title: Language Programmes for Every Level
  description: Every programme is free, flexible, and matched to your goals and schedule.
  items:
    - icon: local
      title: English Lessons
      description: "Conversational and academic English from beginner to advanced, with a focus on real confidence."
      features:
        - One-on-one or small group
        - Flexible weekly scheduling
        - Learning materials included
    - icon: longDistance
      title: French Lessons
      description: Structured French instruction with native and fluent speakers from around the world.
      features:
        - Grammar & vocabulary building
        - Weekly conversation practice
        - Beginner to advanced levels
    - icon: commercial
      title: German Lessons
      description: "Step-by-step German instruction, from the alphabet to advanced conversation."
      features:
        - Structured curriculum
        - Speaking-focused lessons
        - Goethe-Institut exam prep available
    - icon: packing
      title: Conversation Partners
      description: Low-pressure, weekly conversation practice to build fluency and confidence in any of our three languages.
      features:
        - No homework, just conversation
        - Flexible, casual scheduling
        - Great alongside formal lessons
    - icon: storage
      title: Group Workshops
      description: Small-group classes for students who learn best alongside peers, on grammar, writing, and speaking.
      features:
        - Small groups of 3-5 students
        - Peer learning environment
        - Rotating monthly topics
    - icon: specialty
      title: Exam Preparation
      description: "Focused, one-on-one coaching for IELTS, TOEFL, DELF, and Goethe-Institut certification exams."
      features:
        - Practice tests included
        - Experienced exam tutors
        - Personalised study plan

# Process Section
process:
  title: How It Works
  description: Getting matched with a volunteer educator takes just a few simple steps.
  steps:
    - number: "1"
      title: Sign Up Free
      description: "Tell us your language, level, and availability — it only takes a few minutes."
    - number: "2"
      title: Get Matched
      description: We pair you with a vetted volunteer educator who fits your goals and schedule.
    - number: "3"
      title: Start Lessons
      description: Meet online for regular lessons, at a pace that works for you.
    - number: "4"
      title: Grow Your Fluency
      description: "Build real, lasting language skills with consistent support along the way."

# CTA Section
cta:
  title: Ready to Start Learning?
  description: "Sign up for free lessons today — no cost, no catch, just support to help you learn."
  primaryCta:
    text: Sign Up Free
    url: /contact
