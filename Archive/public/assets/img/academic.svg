<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">A sprout growing from a stack of books</title>
  <rect width="600" height="400" fill="#1F2B4D"/>
  <circle cx="60" cy="345" r="110" fill="white" opacity="0.06"/>
  <circle cx="545" cy="55" r="100" fill="white" opacity="0.06"/>

  <!-- Shadow -->
  <ellipse cx="300" cy="342" rx="200" ry="9" fill="#000" opacity="0.22"/>

  <!-- Book stack -->
  <g>
    <!-- bottom -->
    <rect x="140" y="292" width="320" height="48" rx="5" fill="#E8A33D"/>
    <g stroke="#1F2B4D" stroke-width="3" opacity="0.3">
      <line x1="165" y1="292" x2="165" y2="340"/><line x1="176" y1="292" x2="176" y2="340"/>
      <line x1="424" y1="292" x2="424" y2="340"/><line x1="435" y1="292" x2="435" y2="340"/>
    </g>
    <rect x="262" y="304" width="76" height="24" rx="3" fill="#F6EFE0" opacity="0.9"/>

    <!-- middle -->
    <rect x="170" y="246" width="270" height="46" rx="5" fill="#F6EFE0"/>
    <g stroke="#1F2B4D" stroke-width="3" opacity="0.25">
      <line x1="196" y1="246" x2="196" y2="292"/><line x1="207" y1="246" x2="207" y2="292"/>
      <line x1="403" y1="246" x2="403" y2="292"/><line x1="414" y1="246" x2="414" y2="292"/>
    </g>
    <g stroke="#E8A33D" stroke-width="4" stroke-linecap="round">
      <line x1="262" y1="262" x2="348" y2="262"/><line x1="276" y1="276" x2="334" y2="276"/>
    </g>

    <!-- top -->
    <rect x="190" y="202" width="245" height="44" rx="5" fill="#5B7DB1"/>
    <g stroke="#1F2B4D" stroke-width="3" opacity="0.3">
      <line x1="214" y1="202" x2="214" y2="246"/><line x1="225" y1="202" x2="225" y2="246"/>
      <line x1="400" y1="202" x2="400" y2="246"/><line x1="411" y1="202" x2="411" y2="246"/>
    </g>
    <circle cx="312" cy="224" r="9" fill="#F6EFE0" opacity="0.9"/>
  </g>

  <!-- Sprout -->
  <g>
    <path d="M312 202 C312 180 314 162 312 138" fill="none" stroke="#8FD3A5" stroke-width="5" stroke-linecap="round"/>
    <path d="M312 164 C286 166 268 150 265 126 C292 126 310 140 312 164 Z" fill="#8FD3A5"/>
    <path d="M312 150 C338 152 356 136 359 111 C332 113 314 128 312 150 Z" fill="#6DBB8A"/>
  </g>

  <!-- Pencil leaning on the stack -->
  <g transform="translate(480,338) rotate(-20)">
    <rect x="-7" y="-12" width="14" height="12" rx="2" fill="#E3BCBE"/>
    <rect x="-7" y="-18" width="14" height="6" fill="#C9CED6"/>
    <rect x="-7" y="-152" width="14" height="134" fill="#E27D60"/>
    <path d="M-7 -152 L7 -152 L0 -174 Z" fill="#F6EFE0"/>
    <path d="M-2.6 -165 L2.6 -165 L0 -174 Z" fill="#1F2B4D"/>
  </g>

  <!-- Sparkles -->
  <g fill="#E8A33D" opacity="0.9">
    <path d="M225 100 Q225 108 217 108 Q225 108 225 116 Q225 108 233 108 Q225 108 225 100 Z"/>
    <path d="M410 82 Q410 88 404 88 Q410 88 410 94 Q410 88 416 88 Q410 88 410 82 Z"/>
    <path d="M110 210 Q110 216 104 216 Q110 216 110 222 Q110 216 116 216 Q110 216 110 210 Z"/>
  </g>
  <g fill="#F6EFE0" opacity="0.5">
    <circle cx="150" cy="120" r="3"/><circle cx="470" cy="150" r="3"/><circle cx="520" cy="250" r="2.5"/>
  </g>
</svg>
