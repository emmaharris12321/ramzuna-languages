# How It Works Section
howItWorks:
  badge: How It Works
  title: From Sign-Up to Fluency in 4 Steps
  description: We have made it simple to start learning — or to start teaching.
  steps:
    - number: "01"
      title: Sign Up Free
      description: Tell us your language goals, current level, and availability. It takes less than five minutes.
    - number: "02"
      title: Get Matched
      description: We pair you with a vetted volunteer educator based on your language, level, and schedule.
    - number: "03"
      title: Start Learning
      description: Meet online for regular lessons — in a small group by default, or asynchronously on your own schedule.
    - number: "04"
      title: Track Your Progress
      description: Build real fluency over time, with check-ins to keep your learning on course.

