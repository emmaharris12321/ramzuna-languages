# FAQ Section
faq:
  badge: FAQ
  title: Frequently Asked Questions
  description: Answers to the questions we hear most often about our programmes.
  items:
    - question: Is this really completely free?
      answer: "Yes. Every lesson, for every student, is entirely free — funded by donations and run by volunteer educators. There are no hidden fees at any stage."
    - question: How are volunteer educators vetted?
      answer: "Every educator completes an application, a language proficiency check, and a short interview with our coordination team before being matched with students."
    - question: Can I choose which language I learn?
      answer: "Yes — you can request English, French, or German when you sign up, along with your current level and learning goals."
    - question: How do I become a volunteer educator?
      answer: "Visit our Get Involved page and fill out the volunteer application. We will walk you through a short onboarding process before matching you with a student."
    - question: How is Ramzunā Languages funded?
      answer: "We are funded entirely by individual donations and partner organisations. Every donation goes toward coordination, learning materials, and reaching new students."

