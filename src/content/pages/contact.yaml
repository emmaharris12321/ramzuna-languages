# ============================================
# Contact Page Content
# Edit this file to update the Contact page
# ============================================

title: Contact Us
description: "Questions about signing up, volunteering, or supporting our work? We would love to hear from you."

# Contact Form Section
form:
  title: Send Us a Message
  description: Whether you are a prospective student, volunteer, or donor, we will get back to you within a few days.
  submitText: Send Message
  fields:
    - name: name
      label: Full Name
      type: text
      placeholder: Your name
      required: true
    - name: email
      label: Email
      type: email
      placeholder: you@example.com
      required: true
    - name: subject
      label: Subject
      type: text
      placeholder: "Student sign-up, volunteering, partnership..."
    - name: message
      label: Message
      type: textarea
      placeholder: "Tell us a bit about what you are looking for..."
      required: true

# Contact Info
info:
  title: Get in Touch
  description: Our coordination team responds within 2-3 business days.
  items:
    - icon: email
      title: Email
      value: contacteam@ramzunalanguages.org
      url: "mailto:contacteam@ramzunalanguages.org"
    - icon: location
      title: Where We Operate
      value: "Fully remote — students across Palestine, educators in 15+ countries"
    - icon: clock
      title: Response Time
      lines:
        - "Student & volunteer enquiries: 2-3 business days"
        - "Urgent matters: flagged and prioritised"
